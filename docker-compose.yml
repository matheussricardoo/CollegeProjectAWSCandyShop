services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doces-backend
    ports:
      - "127.0.0.1:25000:25000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: doces-frontend
    environment:
      - BACKEND_URL=http://backend:25000
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - backend
    restart: unless-stopped
